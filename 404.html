<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frontier Archives - Signal Lost</title>
    <meta name="description" content="The requested FrontierHQ page could not be located." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="application-name" content="FrontierHQ" />
    <meta name="apple-mobile-web-app-title" content="FrontierHQ" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://frontierhq.xyz/" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="./assets/icons/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="msapplication-config" content="./browserconfig.xml" />
  </head>
  <body data-lang="en">
    <div class="landing-shell">
      <header class="topbar" aria-label="FrontierHQ topbar">
        <a class="brand" href="./" aria-label="Frontier Archives home">
          <img class="brand__icon" src="./assets/icons/favicon-32x32.png" alt="" width="20" height="20" />
          <span class="brand__text">
            <span class="brand__name">Frontier Archives</span>
            <span class="brand__domain">&gt;FrontierHQ</span>
          </span>
        </a>
      </header>

      <main class="hero" aria-labelledby="missing-title">
        <section class="hero__copy">
          <span class="hero__eyebrow">FrontierHQ</span>
          <h1 id="missing-title" data-text="Signal lost">Signal lost</h1>
          <p class="hero__lede">The page you requested is outside the current grid.</p>
          <hr class="hero__divider" aria-hidden="true" />
          <p class="hero__status"><a class="hero__return" href="./">Return to the main signal</a></p>
        </section>
      </main>

      <footer class="footer" aria-label="Credits">
        <div class="footer__stack">
          <span class="footer__brandline">frontierhq.xyz</span>
          <span class="footer__note">
            <span>© 2026</span>
            <span>Stalzone</span>
            <span class="footer__exbo-wrap">
              <span aria-hidden="true">(</span>
              <span class="footer__org footer__org--exbo" aria-label="EXBO">
                <span class="footer__org-ex">EX</span><span class="footer__org-bo">BO</span>
              </span>
              <span aria-hidden="true">)</span>
            </span>
            <span class="footer__divider-dot" aria-hidden="true">·</span>
            <span>FrontierHQ (Axulogic)</span>
          </span>
        </div>
      </footer>
    </div>
  </body>
</html>
