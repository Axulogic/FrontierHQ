<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frontier Archives - STALZONE</title>
    <meta
      name="description"
      content="FrontierHQ is a STALZONE companion utility focused on market signals, trading context, and field-ready tools for zoners."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="application-name" content="FrontierHQ" />
    <meta name="apple-mobile-web-app-title" content="FrontierHQ" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FrontierHQ" />
    <meta property="og:title" content="Frontier Archives - STALZONE" />
    <meta
      property="og:description"
      content="FrontierHQ is a STALZONE companion utility focused on market signals, trading context, and field-ready tools for zoners."
    />
    <meta property="og:url" content="https://frontierhq.xyz/" />
    <meta property="og:image" content="https://frontierhq.xyz/assets/icons/android-chrome-192x192.png" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Frontier Archives - STALZONE" />
    <meta
      name="twitter:description"
      content="FrontierHQ is a STALZONE companion utility focused on market signals, trading context, and field-ready tools for zoners."
    />
    <meta name="twitter:image" content="https://frontierhq.xyz/assets/icons/android-chrome-192x192.png" />
    <link rel="canonical" href="https://frontierhq.xyz/" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="./assets/icons/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preload" href="./assets/icons/favicon-32x32.png" as="image" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="msapplication-config" content="./browserconfig.xml" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FrontierHQ",
        "url": "https://frontierhq.xyz/",
        "description": "FrontierHQ is a STALZONE companion utility focused on market signals, trading context, and field-ready tools for zoners.",
        "inLanguage": "en"
      }
    </script>
  </head>
  <body data-lang="en">
    <div class="landing-shell">
      <header class="topbar" aria-label="FrontierHQ topbar">
        <a class="brand" href="./" aria-label="Frontier Archives home">
          <img class="brand__icon" src="./assets/icons/favicon-32x32.png" alt="" width="20" height="20" />
          <span class="brand__text">
            <span class="brand__name">Frontier Archives</span>
            <span class="brand__domain">>FrontierHQ</span>
          </span>
        </a>

        <nav class="language-switcher" aria-label="Language switcher">
          <span class="language-switcher__rail" aria-hidden="true"></span>
          <span class="language-switcher__thumb" aria-hidden="true"></span>
          <button class="language-switcher__button is-active" type="button" data-lang-switch="en">EN</button>
          <button class="language-switcher__button" type="button" data-lang-switch="pt-BR">PT-BR</button>
          <button class="language-switcher__button" type="button" data-lang-switch="ru">RU</button>
        </nav>
      </header>

      <main class="hero" aria-labelledby="landing-title">
        <section class="hero__copy">
          <span class="hero__eyebrow" data-i18n="hero.eyebrow">FrontierHQ</span>
          <h1 id="landing-title" data-i18n="hero.title" data-text="The signal is almost up">The signal is almost up</h1>
          <p class="hero__lede" data-i18n="hero.lede">Zoner, hold your position!</p>
          <hr class="hero__divider" aria-hidden="true" />
          <p class="hero__status" data-i18n="hero.status">Coming soon</p>
        </section>
      </main>

      <footer class="footer" aria-label="Credits">
        <div class="footer__stack">
          <span class="footer__brandline" data-i18n="footer.brandline">frontierhq.xyz</span>
          <span class="footer__note">
            <span data-i18n="footer.copyrightPrefix">© 2026</span>
            <span data-i18n="footer.stalzone">Stalzone</span>
            <span class="footer__exbo-wrap">
              <span aria-hidden="true">(</span>
              <span class="footer__org footer__org--exbo" aria-label="EXBO">
                <span class="footer__org-ex">EX</span><span class="footer__org-bo">BO</span>
              </span>
              <span aria-hidden="true">)</span>
            </span>
            <span class="footer__divider-dot" aria-hidden="true">·</span>
            <span data-i18n="footer.frontier">FrontierHQ (Axulogic)</span>
          </span>
        </div>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
